<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/academicons/1.9.4/css/academicons.min.css">
<style>
:root{
  --bg:#ffffff;
  --bg-alt:#f7f7f7;
  --fg:#151515;
  --text:#34383d;
  --muted:#757a80;
  --line:#e6e6e6;
  --accent:#dbb16f;      /* gold: icons, buttons, borders */
  --link:#b8863b;        /* deeper gold so inline text links stay readable on white */
  --accent-ink:#1a1a1a;
  --hl:#c62828;
  --head:"Montserrat", "Segoe UI", system-ui, sans-serif;
  --body:"Roboto", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14171c; --bg-alt:#1a1e24; --fg:#f2f4f7; --text:#d3d8df; --muted:#97a0ab; --line:#2b3139;
    --accent:#dbb16f; --link:#e3bd7f; --accent-ink:#14171c; --hl:#ff8a80; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14171c; --bg-alt:#1a1e24; --fg:#f2f4f7; --text:#d3d8df; --muted:#97a0ab; --line:#2b3139;
  --accent:#dbb16f; --link:#e3bd7f; --accent-ink:#14171c; --hl:#ff8a80; color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
img, video{max-width:100%}
html{scroll-behavior:smooth; scroll-padding-top:64px}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} *{transition:none!important} }
body{margin:0; background:var(--bg); color:var(--text); font:400 1rem/1.65 var(--body); -webkit-font-smoothing:antialiased}
a{color:var(--link); text-decoration:none; transition:color .2s}
a:hover{text-decoration:underline; text-underline-offset:3px}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:2px}
h1, h2, h3{font-family:var(--head); color:var(--fg); margin:0}
.container{max-width:1140px; margin:0 auto; padding-left:max(20px, env(safe-area-inset-left, 0px)); padding-right:max(20px, env(safe-area-inset-right, 0px))}

/* navbar */
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top, 0px); z-index:10; background:var(--bg)}
.nav{position:sticky; top:env(safe-area-inset-top, 0px); z-index:5; background:var(--bg); box-shadow:0 1px 0 var(--line)}
.nav .container{display:flex; align-items:center; gap:28px; height:60px}
.brand{font:700 1.05rem var(--head); color:var(--fg)}
.brand:hover{text-decoration:none; color:var(--accent)}
.menu{display:flex; gap:24px; margin-left:auto; font:600 .8125rem var(--head)}
.menu a{color:var(--muted)}
.menu a:hover{color:var(--accent); text-decoration:none}
.theme-btn{border:0; background:none; color:var(--muted); width:32px; height:32px; cursor:pointer; font-size:1rem}
.theme-btn:hover{color:var(--accent)}
@media (max-width:700px){ .menu{display:none} .theme-btn{margin-left:auto} }

/* sections */
.home{padding-block:72px; background:var(--bg)}
.home:nth-of-type(even){background:var(--bg-alt)}
.home.first{padding-top:56px}
@media (max-width:760px){ .home{padding-block:44px} .home.first{padding-top:36px} }

/* about */
.about{display:grid; grid-template-columns:minmax(0,4fr) minmax(0,8fr); gap:40px; align-items:start}
@media (max-width:860px){ .about{grid-template-columns:minmax(0,1fr); gap:32px} }
.portrait{text-align:center}
.avatar{width:190px; max-width:100%; aspect-ratio:1; border-radius:50%; object-fit:cover; display:block; margin:0 auto 18px}
.portrait h2{font-weight:400; font-size:1.875rem; line-height:1.2}
.portrait .native{font-size:.875rem; color:var(--muted)}
.portrait .role{margin-top:6px; color:var(--muted)}
.portrait .aff{font-size:.9375rem}
.portrait .next{margin-top:2px; font-size:.8125rem; color:var(--muted)}
.icons{display:flex; justify-content:center; gap:16px; margin-top:14px; font-size:1.5rem; line-height:1}
.icons a{color:var(--accent)}
.icons a:hover{opacity:.75; text-decoration:none}
.bio h1{font-weight:400; font-size:1.875rem; margin-bottom:14px}
.bio p{margin:0 0 12px}
.bio-cols{display:grid; grid-template-columns:minmax(0,5fr) minmax(0,7fr); gap:28px; margin-top:22px}
@media (max-width:560px){ .bio-cols{grid-template-columns:minmax(0,1fr); gap:20px} }
.bio h3{font-weight:600; font-size:1rem; margin-bottom:8px}
.ul-plain{margin:0; padding-left:18px; font-size:.9375rem}
.ul-plain li{margin-bottom:2px}
.ul-edu{list-style:none; margin:0; padding:0; font-size:.9375rem}
.ul-edu li{position:relative; padding-left:26px; margin-bottom:10px}
.ul-edu i{position:absolute; left:0; top:4px; color:var(--accent); font-size:.95rem}
.ul-edu .course{color:var(--fg); line-height:1.4}
.ul-edu .institution{font-size:.8125rem; color:var(--muted)}

/* two-column section: heading on the left, content on the right */
.sec{display:grid; grid-template-columns:minmax(0,3fr) minmax(0,8fr); gap:48px; align-items:start}
@media (max-width:860px){ .sec{grid-template-columns:minmax(0,1fr); gap:20px} }
.sec-head h2{font-weight:400; font-size:1.875rem; line-height:1.2}
.sec-head p{margin:12px 0 0; font-size:.8125rem; color:var(--muted)}

/* news */
.news{list-style:none; margin:0; padding:0; display:grid; gap:8px; font-size:.9375rem}
.news li{display:grid; grid-template-columns:72px minmax(0,1fr); gap:14px}
.news .d{color:var(--muted); font-variant-numeric:tabular-nums}

/* publications */
.pubs{display:grid; gap:40px}
.pub{display:grid; grid-template-columns:minmax(0,1fr) 250px; gap:28px; align-items:start}
@media (max-width:640px){ .pub{grid-template-columns:minmax(0,1fr); gap:12px} .pub .media{order:-1} }
.pub h3{font-weight:700; font-size:1.125rem; line-height:1.35}
.pub h3 a{color:var(--fg)}
.pub h3 a:hover{color:var(--accent); text-decoration:none}
.pub .venue{margin-top:4px; font-size:.9375rem}
.pub .venue .hl{color:var(--hl); font-weight:500}
.pub .venue .track{color:var(--muted)}
.pub .tl{margin-top:2px; font-size:.9375rem}
.pub .authors{margin-top:6px; font-size:.875rem; letter-spacing:.01em; color:var(--muted)}
.pub .authors b{color:var(--fg); font-weight:700}
.btns{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
.btns a, .btns button{font:400 .8125rem/1 var(--body); padding:5px 10px; border:1px solid var(--accent); border-radius:3px; color:var(--link); background:transparent; cursor:pointer; transition:background .2s, color .2s}
.btns a:hover, .btns button:hover, .btns button[aria-expanded="true"]{background:var(--accent); color:var(--accent-ink); text-decoration:none}
.bib{margin-top:10px; position:relative}
.bib pre{margin:0; padding:12px 14px; background:var(--bg-alt); border:1px solid var(--line); border-radius:4px; font:12px/1.55 ui-monospace, "SFMono-Regular", Consolas, monospace; color:var(--text); overflow-x:auto}
.home:nth-of-type(even) .bib pre{background:var(--bg)}
.bib .copy{position:absolute; right:6px; top:6px; border:0; background:none; color:var(--link); font:500 .75rem var(--body); cursor:pointer; padding:2px 4px}
.media{display:block; width:100%; aspect-ratio:16/10; border-radius:4px; overflow:hidden; background:#fff}
.media img, .media video{display:block; width:100%; height:100%; object-fit:cover}

/* experience */
.xp{list-style:none; margin:0; padding:0; display:grid; gap:22px}
.xp .top{display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:2px 16px}
.xp .what{font:600 1rem var(--head); color:var(--fg)}
.xp .when{font-size:.875rem; color:var(--muted); font-variant-numeric:tabular-nums}
.xp .org{font-size:.9375rem; color:var(--muted)}
.xp p{margin:4px 0 0; font-size:.9375rem}

/* awards */
.lst{list-style:none; margin:0; padding:0; display:grid; gap:6px; font-size:.9375rem}
.lst li{display:grid; grid-template-columns:52px minmax(0,1fr); gap:12px}
.lst .y{color:var(--muted); font-variant-numeric:tabular-nums}

footer{border-top:1px solid var(--line); background:var(--bg)}
footer .container{padding-block:24px max(28px, env(safe-area-inset-bottom, 0px)); font-size:.8125rem; color:var(--muted); text-align:center}
</style>
</head>
<body>

<header class="nav">
  <div class="container">
    <a class="brand" href="#top" id="brand">Giyong Moon</a>
    <nav class="menu" aria-label="Sections">
      <a href="#publications">Publications</a>
      <a href="#news">News</a>
      <a href="#experience">Experience</a>
      <a href="#awards">Awards</a>
    </nav>
    <button class="theme-btn" id="theme-btn" type="button" aria-label="Toggle dark mode"><i class="fa-solid fa-moon"></i></button>
  </div>
</header>

<main id="top">
  <section class="home first"><div class="container about">
    <div class="portrait" id="portrait"></div>
    <div class="bio" id="bio"></div>
  </div></section>

  <section class="home" id="publications"><div class="container sec">
    <div class="sec-head"><h2>Publications</h2><p id="pub-note"></p></div>
    <div class="pubs" id="pubs"></div>
  </div></section>

  <section class="home" id="news"><div class="container sec">
    <div class="sec-head"><h2>News</h2></div>
    <ul class="news" id="news-list"></ul>
  </div></section>

  <section class="home" id="experience"><div class="container sec">
    <div class="sec-head"><h2>Experience</h2></div>
    <ul class="xp" id="xp"></ul>
  </div></section>

  <section class="home" id="awards"><div class="container sec">
    <div class="sec-head"><h2>Awards &amp; Honors</h2></div>
    <ul class="lst" id="awards-list"></ul>
  </div></section>
</main>

<footer><div class="container" id="foot"></div></footer>

<script>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
  const ext = h => /^(https?:)?\/\//.test(h) ? ` target="_blank" rel="noopener"` : "";
  const P = DATA.profile;

  /* theme */
  const root = document.documentElement;
  $("#theme-btn").addEventListener("click", () => {
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("theme", root.dataset.theme); } catch(e){}
  });

  /* about */
  $("#brand").textContent = P.name;
  $("#foot").textContent = `© ${new Date().getFullYear()} ${P.name} · Last updated ${DATA.updated}`;
  const [affName, affUrl] = Array.isArray(P.affiliation) ? P.affiliation : [P.affiliation, ""];
  $("#portrait").innerHTML = `
    ${P.photo ? `<img class="avatar" src="${esc(P.photo)}" alt="${esc(P.name)}" width="190" height="190">` : ""}
    <h2>${esc(P.name)}</h2>
    ${P.nativeName ? `<div class="native">${esc(P.nativeName)}</div>` : ""}
    <div class="role">${esc(P.role)}</div>
    <div class="aff">${affUrl ? `<a href="${esc(affUrl)}"${ext(affUrl)}>${esc(affName)}</a>` : esc(affName)}</div>
    ${P.next ? `<div class="next">${esc(P.next)}</div>` : ""}
    <div class="icons">${P.links.map(([t,h,ic]) => `<a href="${esc(h)}"${ext(h)} title="${esc(t)}" aria-label="${esc(t)}"><i class="${esc(ic)}"></i></a>`).join("")}</div>`;

  $("#bio").innerHTML = `
    <h1>About me</h1>
    ${P.bio.map(p => `<p>${p}</p>`).join("")}
    <div class="bio-cols">
      <div><h3>Interests</h3><ul class="ul-plain">${P.interests.map(i => `<li>${esc(i)}</li>`).join("")}</ul></div>
      ${P.education.length ? `<div><h3>Education</h3><ul class="ul-edu">${P.education.map(([y,d,s]) => `<li><i class="fa-solid fa-graduation-cap"></i><div class="course">${esc(d)}, ${esc(y)}</div><div class="institution">${esc(s)}</div></li>`).join("")}</ul></div>` : ""}
    </div>`;

  /* news */
  $("#news-list").innerHTML = DATA.news.map(([d,t]) => `<li><span class="d">${esc(d)}</span><span>${t}</span></li>`).join("");

  /* publications */
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const boldMe = a => esc(a).split(esc(P.me)).join(`<b>${esc(P.me)}</b>`);
  $("#pub-note").innerHTML = DATA.pubNote || "";
  $("#pubs").innerHTML = DATA.publications.map((p, n) => {
    const first = Object.values(p.links)[0] || "";
    const isVid = /\.(mp4|webm)$/i.test(p.thumb || "");
    const media = !p.thumb ? ""
      : isVid ? `<video src="${esc(p.thumb)}"${p.poster ? ` poster="${esc(p.poster)}"` : ""} muted loop playsinline preload="metadata"${reduceMotion ? "" : " autoplay"} aria-label="${esc(p.title)}"></video>`
      : `<img src="${esc(p.thumb)}" alt="" loading="lazy" width="880" height="550">`;
    return `<article class="pub">
      <div>
        <h3>${first ? `<a href="${esc(first)}"${ext(first)}>${esc(p.title)}</a>` : esc(p.title)}</h3>
        <div class="venue"><em>${esc(p.venue)}</em>${p.highlight ? ` <span class="hl">(${esc(p.highlight)})</span>` : ""}${p.track ? ` <span class="track">· ${esc(p.track)}</span>` : ""}</div>
        ${p.tagline ? `<div class="tl">${esc(p.tagline)}</div>` : ""}
        <div class="authors">${boldMe(p.authors)}</div>
        <div class="btns">
          ${Object.entries(p.links).map(([k,v]) => `<a href="${esc(v)}"${ext(v)}>${esc(k)}</a>`).join("")}
          ${p.bibtex ? `<button type="button" aria-expanded="false" aria-controls="bib${n}" data-bib="${n}">Cite</button>` : ""}
        </div>
        ${p.bibtex ? `<div class="bib" id="bib${n}" hidden><pre id="bibpre${n}">${esc(p.bibtex)}</pre><button class="copy" type="button" data-copy="#bibpre${n}">Copy</button></div>` : ""}
      </div>
      ${media ? (first ? `<a class="media" href="${esc(first)}"${ext(first)} tabindex="-1" aria-hidden="true">${media}</a>` : `<div class="media">${media}</div>`) : ""}
    </article>`;
  }).join("");
  $("#pubs").addEventListener("click", e => {
    const b = e.target.closest("[data-bib]"); if (!b) return;
    const box = document.getElementById("bib" + b.dataset.bib);
    box.hidden = !box.hidden; b.setAttribute("aria-expanded", !box.hidden);
  });

  /* experience / awards */
  $("#xp").innerHTML = DATA.experience.map(([w,r,o,h,extra,d]) => `<li>
      <div class="top"><span class="what">${esc(r)}</span><span class="when">${esc(w)}</span></div>
      <div class="org">${h ? `<a href="${esc(h)}"${ext(h)}>${esc(o)}</a>` : esc(o)}${extra ? " · " + esc(extra) : ""}</div>
      ${d ? `<p>${esc(d)}</p>` : ""}
    </li>`).join("");
  $("#awards-list").innerHTML = DATA.awards.map(([y,t]) => `<li><span class="y">${esc(y)}</span><span>${esc(t)}</span></li>`).join("");

  /* copy BibTeX */
  document.addEventListener("click", e => {
    const b = e.target.closest("[data-copy]"); if (!b) return;
    const el = document.querySelector(b.dataset.copy);
    const reset = () => setTimeout(() => b.textContent = "Copy", 1400);
    const sel = () => { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "Selected"; reset(); };
    try { navigator.clipboard.writeText(el.textContent).then(() => { b.textContent = "Copied"; reset(); }, sel); } catch(err){ sel(); }
  });
})();
</script>
</body>
</html>
